# Centralized version catalog. Spring Boot starters are omitted on purpose —
# their versions are governed by the Spring Boot BOM via the
# io.spring.dependency-management plugin.
#
# The static-analysis stack (Spotless, Checkstyle, PMD, SpotBugs, Error Prone,
# NullAway, Forbidden APIs, Modernizer) is owned by the `vkr.lint-conventions`
# preset in buildSrc, which pins its own tool versions.
[versions]
springBoot = "4.1.0"
dependencyManagement = "1.1.7"
hibernate = "7.4.1.Final"
graalvm = "1.1.4"

archunit = "1.4.2"

springdoc = "3.0.3"
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"
jspecify = "1.0.0"
spotbugsAnnotations = "4.10.3"

[libraries]
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugsAnnotations" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
hibernate = { id = "org.hibernate.orm", version.ref = "hibernate" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
