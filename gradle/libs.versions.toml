# Centralized version catalog. Spring Boot starters are omitted on purpose —
# their versions are governed by the Spring Boot BOM via the
# io.spring.dependency-management plugin.
[versions]
springBoot = "4.1.0"
dependencyManagement = "1.1.7"
hibernate = "7.4.1.Final"
graalvm = "1.1.4"
spotless = "8.8.0"
errorpronePlugin = "5.1.0"
spotbugsPlugin = "6.5.9"

springModulith = "2.1.0"
archunit = "1.4.2"

springdoc = "3.0.3"
mapstruct = "1.6.3"
lombokMapstructBinding = "0.2.0"
errorProneCore = "2.50.0"
nullaway = "0.13.7"
jspecify = "1.0.0"
spotbugsAnnotations = "4.10.3"
findsecbugs = "1.14.0"

[libraries]
# Spring Modulith starters are versioned by the spring-modulith BOM (imported in
# build.gradle.kts), so they carry no explicit version here.
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorProneCore" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugsAnnotations" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
hibernate = { id = "org.hibernate.orm", version.ref = "hibernate" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugsPlugin" }
