name: Java CI with Maven

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & test (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: ./mvnw clean compile

      - name: Run tests
        run: ./mvnw test

      - name: Package (optional)
        run: ./mvnw package -DskipTests

      - name: Upload test reports (if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Build native Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Build native image with Maven (GraalVM warnings check)
        run: ./mvnw -B -Pnative -DskipTests native:compile 2>&1 | tee native-build.log
        continue-on-error: true

      - name: Parse GraalVM warnings
        run: |
          WARNINGS=$(grep -i "warning" native-build.log | grep -v "^$" || echo "No warnings found")
          echo "## GraalVM Native Build Warnings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $(echo "$WARNINGS" | wc -l) -gt 0 ]; then
            echo "⚠️ Found warnings:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$WARNINGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No warnings detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build native image Docker (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.native
          push: false
          tags: vkr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
