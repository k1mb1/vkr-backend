name: Java CI (Fast + Native)

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & test (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '**/*.java'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'config/**'
              - 'src/main/resources/**'
              - 'src/test/**'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles main+test and runs the full static-analysis gate: Spotless,
      # Checkstyle, PMD, SpotBugs (+ findsecbugs & fb-contrib), Forbidden APIs
      # and Modernizer (Error Prone / NullAway run as part of compilation).
      # Tests are excluded here and run in the dedicated step below.
      - name: Static analysis & compile
        run: ./gradlew --no-daemon check -x test

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew --no-daemon test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/

  docker:
    name: Docker build (JVM)
    needs: build
    # Image builds are expensive: run them for PRs and the main branches only,
    # not on every feature-branch push (which still gets the build+test gate).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build JVM image
        run: |
          docker buildx build \
            --file ./Dockerfile \
            --tag vkr-backend:ci-jvm \
            --cache-from type=gha,scope=jvm \
            --cache-to type=gha,mode=max,scope=jvm \
            --progress=plain \
            .

  docker-native:
    name: Native Docker build (single compile)
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build native image (compiled once, log captured)
        shell: bash

        run: |
          set -o pipefail
          docker buildx build \
            --file ./Dockerfile.native \
            --tag vkr-backend:ci \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress=plain \
            . 2>&1 | tee native-build.log

      - name: Report GraalVM warnings
        if: always()
        run: |
          echo "## GraalVM Native Build Warnings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          WARNINGS=$(grep -iE "warning" native-build.log || true)
          if [ -n "$WARNINGS" ]; then
            echo "⚠️ Found warnings:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$WARNINGS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No warnings detected" >> "$GITHUB_STEP_SUMMARY"
          fi
