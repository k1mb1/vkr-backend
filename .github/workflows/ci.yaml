name: Java CI with Maven

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults; individual steps get exactly what they need.
permissions:
  contents: read

env:
  # Quiet, reproducible Maven output across every step.
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors"

jobs:
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # publish test results as a check run
      pull-requests: write # post the coverage comment on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          # Caches ~/.m2/repository keyed on the pom.xml hashes.
          cache: "maven"

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # ubuntu-latest ships with a running Docker daemon, so the Testcontainers
      # tests (@SpringBootTest context load + the full-stack integration test) run here.
      # NB: use 'test' (not 'verify'/'package') — the spring-boot process-aot goal binds
      # to prepare-package and would emit hundreds of AOT *__BeanDefinitions classes into
      # target/classes, which JaCoCo would then count as uncovered and wreck the metric.
      - name: Build & test (with coverage)
        run: ./mvnw ${MAVEN_CLI_OPTS} clean test jacoco:report

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: JUnit tests
          path: "target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Coverage summary on PR
        uses: madrapps/jacoco-report@v1.7.2
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Code coverage"
          update-comment: true
          # Informational gate — bump these once a baseline is agreed on.
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Write job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          total=$(grep -rhoE 'Tests run: [0-9]+' target/surefire-reports/*.txt 2>/dev/null \
            | awk '{s+=$3} END {print s+0}')
          cov=""
          if [ -f target/site/jacoco/jacoco.csv ]; then
            cov=$(awk -F, 'NR>1 {im+=$4;ic+=$5; lm+=$8;lc+=$9}
              END { if (im+ic>0) printf "instruction %.1f%% | line %.1f%% (%d/%d lines)",
                    100*ic/(ic+im), 100*lc/(lc+lm), lc, lc+lm }' target/site/jacoco/jacoco.csv)
          fi
          # Print to the build log (visible in Actions) AND the run summary.
          echo "BUILD SUMMARY :: tests=${total} :: coverage=${cov:-n/a}"
          {
            echo "## Build summary"
            echo "- Tests executed: **${total}**"
            echo "- Coverage: **${cov:-n/a}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
