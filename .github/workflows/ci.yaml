name: Java CI (Fast + Native)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Build & test (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '**/*.java'
              - 'pom.xml'
              - 'src/main/resources/**'
              - 'src/test/**'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Compile
        run: ./mvnw -B -q clean compile

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        run: ./mvnw -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker build (JVM)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build JVM image
        run: |
          docker buildx build \
            --file ./Dockerfile \
            --tag vkr-backend:ci-jvm \
            --cache-from type=gha,scope=jvm \
            --cache-to type=gha,mode=max,scope=jvm \
            --progress=plain \
            .

  docker-native:
    name: Native Docker build (single compile)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build native image (compiled once, log captured)
        shell: bash

        run: |
          set -o pipefail
          docker buildx build \
            --file ./Dockerfile.native \
            --tag vkr-backend:ci \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress=plain \
            . 2>&1 | tee native-build.log

      - name: Report GraalVM warnings
        if: always()
        run: |
          echo "## GraalVM Native Build Warnings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          WARNINGS=$(grep -iE "warning" native-build.log || true)
          if [ -n "$WARNINGS" ]; then
            echo "⚠️ Found warnings:" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$WARNINGS" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ No warnings detected" >> "$GITHUB_STEP_SUMMARY"
          fi